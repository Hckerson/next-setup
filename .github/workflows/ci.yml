name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-and-build:
    name: lint · build
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject files over 1 MB
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          range=HEAD
          git cat-file -e "$base^{commit}" 2>/dev/null && range="$base..HEAD"
          large=$(git rev-list --objects $range | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' | awk '$1 == "blob" && $2 > 1048576')
          if [ -n "$large" ]; then echo "$large"; exit 1; fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
